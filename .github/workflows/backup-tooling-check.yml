name: Backup tooling syntax check

on:
  push:
    branches:
      - "backup/ams-free-production-backup"
    paths:
      - "scripts/backup-production.sh"
      - "scripts/backup-supabase-storage.mjs"
      - ".github/workflows/backup-tooling-check.yml"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: bash -n scripts/backup-production.sh
      - name: Check Node.js syntax
        run: node --check scripts/backup-supabase-storage.mjs
