name: Marketplace migration smoke test

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - ".github/workflows/marketplace-migration-smoke.yml"
  push:
    branches:
      - "work/ams-marketplace-upgrade-2026-11-12"
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - ".github/workflows/marketplace-migration-smoke.yml"

permissions:
  contents: read

jobs:
  postgres-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amar_shopping_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d amar_shopping_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Supabase-compatible auth roles and base fixture
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d amar_shopping_test -v ON_ERROR_STOP=1 -f supabase/tests/marketplace_migration_fixture.sql
      - name: Apply marketplace migration to disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d amar_shopping_test -v ON_ERROR_STOP=1 -f supabase/migrations/202611120001_marketplace_foundation.sql
      - name: Verify variant checkout, stock, commission ledger, and wallet balances
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d amar_shopping_test -v ON_ERROR_STOP=1 -f supabase/tests/marketplace_migration_assertions.sql
